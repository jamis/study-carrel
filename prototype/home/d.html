<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home D: Drawer and Desk</title>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  .split { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 49px); }

  /* the list: every focus, the current one pinned first */
  .list { border-right: 1px solid var(--rule); padding: 20px 0 80px; }
  .list .label { padding: 0 20px; margin: 14px 0 6px; }
  .item {
    display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 20px;
    border-left: 2px solid transparent;
  }
  .item:hover { background: var(--paper); }
  .item.sel { background: var(--paper); border-left-color: var(--accent); }
  .item .t { font-size: 17px; line-height: 1.3; }
  .item.cur .t { font-style: italic; }
  .item .meta { font-size: 12px; margin-top: 2px; }
  .resume-phone { display: none; padding: 0 20px 6px 22px; }
  .new { display: block; margin: 18px 20px 0; font-family: var(--sans); font-size: 14px; text-decoration: none; }

  /* the desk: the chosen focus in full */
  .desk { padding: 36px clamp(20px, 5vw, 64px) 96px; max-width: 46em; }
  .back { display: none; }
  .desk h1 { font-size: clamp(28px, 4.5vw, 38px); font-weight: 400; font-style: italic; line-height: 1.2; margin: 8px 0 10px; }
  .desk .desc { color: var(--ink-soft); font-size: 18px; margin: 0 0 10px; }
  .stats { display: flex; gap: 28px; margin: 22px 0 28px; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .stats div { font-family: var(--sans); font-size: 12px; color: var(--ink-soft); }
  .stats b { display: block; font-family: var(--serif); font-weight: 400; font-size: 22px; color: var(--ink); }
  .block { margin-bottom: 26px; }
  .block p { margin: 6px 0 0; font-size: 18px; }
  .block .meta { margin-top: 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actions .go { margin-right: 8px; font-size: 15px; }

  @media (max-width: 760px) {
    .split { grid-template-columns: 1fr; }
    .list { border-right: 0; }
    .split:not(.showing) .desk { display: none; }
    .split.showing .list { display: none; }
    .back { display: inline-block; margin-bottom: 10px; }
    .resume-phone { display: block; }
    .item.sel { border-left-color: transparent; background: transparent; }
  }
</style>
</head>
<body>
<div data-top></div>
<div class="split" id="split">
  <nav class="list" id="list" aria-label="Foci"></nav>
  <main class="desk" id="desk"></main>
</div>
<div data-switch></div>
<script>
  let selected = null;

  Home.render = () => {
    const { esc, span, plural } = Home;
    const [cur, ...past] = FOCI;
    if (!FOCI.some((f) => f.id === selected)) selected = cur.id;
    const f = FOCI.find((x) => x.id === selected);

    const item = (x) => `
      <button class="item ${x.current ? "cur" : ""} ${x.id === selected ? "sel" : ""}" type="button" data-pick="${x.id}">
        <div class="t">${esc(x.title)}</div>
        <div class="meta">${span(x)} · ${plural(x.notes, "note")}</div>
      </button>`;
    document.getElementById("list").innerHTML = `
      <div class="label">Current</div>${item(cur)}
      <a class="resume-phone go" href="${Home.read}">Continue at ${esc(cur.last.ref)} →</a>
      <div class="label">Earlier</div>${past.map(item).join("")}
      <a class="new" href="#">+ New focus</a>`;

    document.getElementById("desk").innerHTML = `
      <button class="chip back" type="button" data-back>‹ All foci</button>
      <div class="label">${f.current ? "Current focus" : "Earlier focus"}</div>
      <h1>${esc(f.title)}</h1>
      ${f.description ? `<p class="desc">${esc(f.description)}</p>` : ""}
      <div class="meta">${span(f)}</div>
      <div class="stats">
        <div><b>${f.notes}</b>notes</div>
        <div><b>${f.keeps}</b>kept</div>
        <div><b>${f.works.length}</b>${f.works.length === 1 ? "work" : "works"}</div>
      </div>
      <div class="block">
        <div class="label">${f.current ? "Where you are" : "Where you stopped"} · ${esc(f.last.ref)}</div>
        <p>${esc(f.last.text)}</p>
      </div>
      <div class="block">
        <div class="label">Last note</div>
        <p class="quote">${esc(f.latest.text)}</p>
        <div class="meta">${esc(f.latest.ref)}, ${f.latest.when}</div>
      </div>
      <div class="block">
        <div class="label">Read in</div>
        <p>${f.works.map((w) => `<a href="#">${esc(w)}</a>`).join(", ")}</p>
      </div>
      <div class="actions">
        ${f.current
          ? `<a class="go" href="${Home.read}">Continue reading →</a><a class="chip" href="#">All notes</a><a class="chip" href="#">Edit</a>`
          : `<button class="chip primary" type="button" data-restore="${f.id}">Make current</button><a class="chip" href="#">Read its notes</a>`}
      </div>`;
  };

  document.addEventListener("click", (e) => {
    const pick = e.target.closest("[data-pick]");
    if (pick) { selected = Number(pick.dataset.pick); Home.render(); document.getElementById("split").classList.add("showing"); scrollTo(0, 0); }
    if (e.target.closest("[data-back]")) document.getElementById("split").classList.remove("showing");
  });
</script>
</body>
</html>
