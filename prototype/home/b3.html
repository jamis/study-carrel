<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home B3: On the Desk</title>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  :root { --card: #fffdf7; }
  :root[data-theme="dark"] { --card: #231e17; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --card: #231e17; } }

  main { max-width: 900px; margin: 0 auto; padding: 40px 16px 96px; }

  /* the card in hand */
  .hand {
    position: relative; max-width: 600px; margin: 0 auto; padding: 26px 30px 22px; background: var(--card);
    border-radius: 3px; box-shadow: 0 2px 4px rgba(60, 40, 20, .08), 0 18px 40px rgba(60, 40, 20, .14);
    background-image: linear-gradient(to bottom, transparent 86px, var(--accent-soft) 86px, var(--accent-soft) 87px, transparent 87px);
  }
  .hand .label { height: 20px; }
  .hand h1 { margin: 0; height: 66px; display: flex; align-items: center; font-size: clamp(22px, 4.2vw, 30px); font-weight: 400; font-style: italic; line-height: 1.15; }
  .hand .desc { color: var(--ink-soft); margin: 16px 0 8px; }
  .hand .resume { display: block; margin: 16px 0; text-decoration: none; color: inherit; }
  .hand .resume .go { color: var(--accent); }
  .hand .resume p { margin: 2px 0 0; font-size: 18px; }
  .hand .resume:hover p { color: var(--accent); }
  .hand .note { margin: 0 0 18px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ribbon { position: absolute; top: 0; right: 28px; width: 16px; height: 34px; background: var(--accent);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); }
  .back-current { margin-left: auto; font-family: var(--sans); font-size: 13px; color: var(--ink-soft); background: none; border: 0; text-decoration: underline; }

  /* the pile: the rest lie loosely, a little askew, overlapping */
  .pile-label { text-align: center; margin: 56px 0 18px; }
  .pile { display: flex; flex-wrap: wrap; justify-content: center; padding: 0 12px; }
  .loose {
    position: relative; width: 230px; height: 138px; margin: -6px -10px; padding: 14px 16px; text-align: left;
    border: 0; border-radius: 3px; background: var(--card); color: var(--ink);
    box-shadow: 0 1px 2px rgba(60, 40, 20, .1), 0 6px 16px rgba(60, 40, 20, .08);
    transform: rotate(var(--r)) translateY(var(--y)); transition: transform .2s, box-shadow .2s;
    background-image: linear-gradient(to bottom, transparent 58px, var(--accent-soft) 58px, var(--accent-soft) 59px, transparent 59px);
  }
  .loose:hover, .loose:focus-visible { transform: rotate(0) translateY(-6px); z-index: 2; box-shadow: var(--shadow); }
  .loose .t { display: block; height: 44px; overflow: hidden; font-size: 17px; font-style: italic; line-height: 1.3; }
  .loose .meta { display: block; margin-top: 14px; font-size: 12px; }
  .loose.in-hand { opacity: .35; }
  .new { display: block; text-align: center; margin-top: 40px; font-style: italic; text-decoration: none; }
  .new:hover { text-decoration: underline; }

  @media (max-width: 560px) {
    .hand { padding: 20px 20px 18px; }
    .loose { width: 78%; height: auto; margin: 2px 0; padding-bottom: 16px; }
    .loose:nth-child(odd) { margin-right: 14%; }
    .loose:nth-child(even) { margin-left: 14%; }
  }
  @media (prefers-reduced-motion: reduce) { .loose { transition: none; } }
</style>
</head>
<body>
<div data-top></div>
<main>
  <article class="hand" id="hand"></article>
  <div class="pile-label label">The rest of the pile</div>
  <div class="pile" id="pile"></div>
  <a class="new" href="#">Take a blank card: a new question</a>
</main>
<div data-switch></div>
<script>
  let held = null;
  // fixed, gentle angles so the pile doesn't reshuffle on every render
  const tilt = [-2.2, 1.4, -0.8, 2.4, -1.6, 0.9, -2.6, 1.8];
  const drop = [4, -2, 8, 0, -4, 6, 2, -6];

  Home.render = () => {
    const { esc, span, plural } = Home;
    if (!FOCI.some((f) => f.id === held)) held = FOCI[0].id;
    const f = FOCI.find((x) => x.id === held);
    document.getElementById("hand").innerHTML = `
      ${f.current ? `<div class="ribbon" aria-hidden="true"></div>` : ""}
      <div class="label">${f.current ? "Your focus" : "An earlier focus"} · ${span(f)}</div>
      <h1>${esc(f.title)}</h1>
      ${f.description ? `<p class="desc">${esc(f.description)}</p>` : ""}
      <a class="resume" href="${Home.read}">
        <span class="meta go">${f.current ? "Continue at" : "Stopped at"} ${esc(f.last.ref)} →</span>
        <p>${esc(f.last.text)}</p>
      </a>
      <p class="note quote">${esc(f.latest.text)} <span class="meta">(${esc(f.latest.ref)}, ${f.latest.when})</span></p>
      <div class="actions">
        ${f.current
          ? `<a class="chip" href="#">All ${f.notes} notes</a><a class="chip" href="#">Edit</a>`
          : `<button class="chip primary" type="button" data-restore="${f.id}">Make current</button><a class="chip" href="#">All ${f.notes} notes</a>
             <button class="back-current" type="button" data-hold="${FOCI[0].id}">back to your focus</button>`}
      </div>`;
    document.getElementById("pile").innerHTML = FOCI.filter((x) => !x.current).map((x, i) => `
      <button class="loose ${x.id === held ? "in-hand" : ""}" type="button" data-hold="${x.id}" style="--r:${tilt[i % 8]}deg; --y:${drop[i % 8]}px">
        <span class="t">${esc(x.title)}</span>
        <span class="meta">${span(x)} · ${plural(x.notes, "note")}</span>
      </button>`).join("");
  };

  document.addEventListener("click", (e) => {
    const h = e.target.closest("[data-hold]");
    if (h) { held = Number(h.dataset.hold); Home.render(); scrollTo({ top: 0, behavior: "smooth" }); }
  });
</script>
</body>
</html>
