<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home B: Index Cards</title>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 96px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 22px; }
  .head h1 { font-size: clamp(26px, 4.5vw, 34px); font-weight: 400; margin: 0; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 8px; min-height: 220px; padding: 20px 20px 16px;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
    box-shadow: 0 1px 0 var(--rule), 0 2px 8px rgba(60, 40, 20, .05);
    /* the faint top rule of an index card */
    background-image: linear-gradient(var(--paper) 52px, var(--accent-soft) 52px, var(--accent-soft) 53px, var(--paper) 53px);
    background-repeat: no-repeat;
  }
  .card h2 { margin: 0; font-size: 20px; font-weight: 400; font-style: italic; line-height: 1.3; min-height: 2.6em; }
  .card .quote { font-size: 16px; margin: 6px 0 0; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
  .card .works { font-family: var(--sans); font-size: 12px; color: var(--ink-faint); }

  /* the current card: twice as wide, a ribbon, the way back in */
  .card.current { grid-column: span 2; border-color: var(--accent); min-height: 260px; }
  .card.current h2 { font-size: clamp(24px, 3.6vw, 30px); min-height: 0; padding-right: 36px; }
  .card.current .desc { color: var(--ink-soft); margin: 0; }
  .ribbon { position: absolute; top: -1px; right: 22px; width: 18px; height: 34px; background: var(--accent);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
  .card.current .resume { font-family: var(--sans); font-size: 14px; color: var(--accent); text-decoration: none; }
  .card.current .resume:hover { text-decoration: underline; }
  .card.current .resume span { color: var(--ink-soft); font-family: var(--serif); font-style: italic; }

  .card.new { align-items: center; justify-content: center; text-align: center; background: transparent; box-shadow: none;
    border-style: dashed; color: var(--ink-soft); text-decoration: none; font-style: italic; }
  .card.new:hover { border-color: var(--accent); color: var(--accent); }
  .card.new .plus { font-size: 28px; font-style: normal; line-height: 1; }

  @media (max-width: 600px) { .card.current { grid-column: auto; } }
</style>
</head>
<body>
<div data-top></div>
<main>
  <div class="head">
    <h1>Your foci</h1>
    <span class="meta" id="count"></span>
  </div>
  <div class="cards" id="cards"></div>
</main>
<div data-switch></div>
<script>
  Home.render = () => {
    const { esc, span, plural } = Home;
    const [cur, ...past] = FOCI;
    document.getElementById("count").textContent = `${FOCI.length} foci · ${FOCI.reduce((n, f) => n + f.notes, 0)} notes`;
    document.getElementById("cards").innerHTML = `
      <article class="card current">
        <div class="ribbon" aria-hidden="true"></div>
        <div class="label">Current · ${span(cur)}</div>
        <h2>${esc(cur.title)}</h2>
        ${cur.description ? `<p class="desc">${esc(cur.description)}</p>` : ""}
        <p class="quote">${esc(cur.latest.text)}</p>
        <a class="resume" href="${Home.read}">Continue at ${esc(cur.last.ref)} → <span>${esc(cur.last.text)}</span></a>
        <div class="foot">
          <span class="works">${cur.works.join(" · ")}</span>
          <a class="chip" href="#">${plural(cur.notes, "note")}</a>
        </div>
      </article>
      ${past.map((f) => `
        <article class="card">
          <div class="label">${span(f)}</div>
          <h2>${esc(f.title)}</h2>
          <p class="quote">${esc(f.latest.text)}</p>
          <div class="works">${f.works.join(" · ")}</div>
          <div class="foot">
            <a class="chip" href="#">${plural(f.notes, "note")}</a>
            <button class="chip" type="button" data-restore="${f.id}">Make current</button>
          </div>
        </article>`).join("")}
      <a class="card new" href="#"><span class="plus">+</span>A new question</a>`;
  };
</script>
</body>
</html>
