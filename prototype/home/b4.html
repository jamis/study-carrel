<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home B4: Stacks</title>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  :root { --card: #fffdf7; --edge: #e6dccb; }
  :root[data-theme="dark"] { --card: #231e17; --edge: #3a3227; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --card: #231e17; --edge: #3a3227; } }

  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 96px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 30px; }
  .head h1 { font-size: clamp(26px, 4.5vw, 34px); font-weight: 400; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 44px 30px; }

  /* a focus is its header card on top of its notes; the edges below show how many there are */
  .stack { position: relative; padding-bottom: calc(var(--depth) * 3px + 34px); }
  .stack.current { grid-column: 1 / -1; max-width: 620px; }
  .peek {
    position: absolute; left: 14px; right: -10px; bottom: 0; height: 120px; padding: 0 16px 8px; display: flex; align-items: flex-end;
    background: var(--card); border-radius: 3px; box-shadow: 0 1px 2px rgba(60, 40, 20, .1);
    transform: rotate(1.6deg); transform-origin: left bottom; transition: transform .25s;
  }
  .peek .quote { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .face {
    position: relative; z-index: 1; display: flex; flex-direction: column; gap: 6px; min-height: 140px; padding: 18px 20px 14px;
    background: var(--card); border-radius: 3px;
    /* the edges of the cards underneath: one line every few notes */
    box-shadow: var(--edges), 0 calc(var(--depth) * 3px + 6px) 16px rgba(60, 40, 20, .1);
    background-image: linear-gradient(to bottom, transparent 46px, var(--accent-soft) 46px, var(--accent-soft) 47px, transparent 47px);
    transition: transform .25s;
  }
  .stack:hover .face { transform: translateY(-4px); }
  .stack:hover .peek { transform: rotate(3.2deg) translateY(4px); }
  .face h2 { margin: 0 0 10px; height: 30px; line-height: 30px; font-size: 20px; font-weight: 400; font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stack.current .face h2 { font-size: 24px; }
  .face .desc { margin: 0; color: var(--ink-soft); font-size: 16px; }
  .face .meta { margin-top: auto; }
  .face .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .face .actions .chip { padding: 4px 10px; font-size: 12px; }
  .face .go { margin-right: 6px; }
  .stack.current .count { color: var(--accent); }

  .new { display: flex; align-items: center; justify-content: center; min-height: 140px; border: 1px dashed var(--rule); border-radius: 3px;
    color: var(--ink-soft); font-style: italic; text-decoration: none; }
  .new:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 560px) { .head .meta { display: none; } .peek { right: 4px; } }
  @media (prefers-reduced-motion: reduce) { .face, .peek { transition: none; } }
</style>
</head>
<body>
<div data-top></div>
<main>
  <div class="head">
    <h1>Your foci</h1>
    <span class="meta">Each stack is a question and the notes it gathered</span>
  </div>
  <div class="grid" id="grid"></div>
</main>
<div data-switch></div>
<script>
  // one card edge per few notes, capped so a long study doesn't tower over the page
  const edges = (n) => {
    const depth = Math.min(12, Math.max(1, Math.ceil(n / 4)));
    const shadows = [];
    for (let i = 1; i <= depth; i++) shadows.push(`0 ${i * 3}px 0 -${Math.min(i, 6) * .5}px var(${i % 2 ? "--edge" : "--card"})`);
    return { depth, shadows: shadows.join(", ") };
  };

  Home.render = () => {
    const { esc, span, plural } = Home;
    document.getElementById("grid").innerHTML = FOCI.map((f) => {
      const { depth, shadows } = edges(f.notes);
      return `
        <article class="stack ${f.current ? "current" : ""}" style="--depth:${depth}; --edges:${shadows}">
          <div class="peek" aria-hidden="true"><span class="quote">${esc(f.latest.text)}</span></div>
          <div class="face">
            <h2 title="${esc(f.title)}">${esc(f.title)}</h2>
                        ${f.current && f.description ? `<p class="desc">${esc(f.description)}</p>` : ""}
            <div class="meta">${f.current ? "Current, " : ""}${span(f)} · <span class="count">${plural(f.notes, "note")}</span> · ${f.works.join(", ")}</div>
            <div class="actions">
              ${f.current
                ? `<a class="go" href="${Home.read}">Continue at ${esc(f.last.ref)} →</a><a class="chip" href="#">Spread out the notes</a><a class="chip" href="#">Edit</a>`
                : `<a class="chip" href="#">Spread out the notes</a><button class="chip" type="button" data-restore="${f.id}">Make current</button>`}
            </div>
          </div>
        </article>`;
    }).join("") + `<a class="new" href="#">+ A new question</a>`;
  };
</script>
</body>
</html>
