<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home B1: Ruled Cards</title>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  :root { --line: rgba(80, 110, 150, .22); --card: #fffdf7; --lh: 28px; }
  :root[data-theme="dark"] { --line: rgba(140, 170, 210, .14); --card: #221d16; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --line: rgba(140, 170, 210, .14); --card: #221d16; } }

  main { max-width: 1080px; margin: 0 auto; padding: 32px 16px 96px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 24px; }
  .head h1 { font-size: clamp(26px, 4.5vw, 34px); font-weight: 400; margin: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 26px; }

  /* a 3×5 card; front and back share one grid cell so the card keeps its size when turned */
  .card { perspective: 1400px; }
  .card.current { grid-column: 1 / -1; max-width: 640px; }
  .inner { display: grid; transition: transform .5s; transform-style: preserve-3d; }
  .card.turned .inner { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    position: relative; min-height: 0; aspect-ratio: 5 / 3; padding: 14px 22px 12px; overflow: hidden;
    background-color: var(--card); border-radius: 3px; box-shadow: 0 1px 2px rgba(60, 40, 20, .12), 0 6px 18px rgba(60, 40, 20, .07);
    /* the ruled lines, and the red-brown line under the heading */
    background-image:
      linear-gradient(to bottom, transparent 51px, var(--accent) 51px, var(--accent) 52px, transparent 52px),
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), var(--line) calc(var(--lh) - 1px), var(--line) var(--lh));
    background-position: 0 0, 0 52px;
    background-size: 100% 100%, 100% calc(100% - 52px);
    background-repeat: no-repeat;
    display: flex; flex-direction: column;
  }
  .back { transform: rotateY(180deg); }
  .face h2 { margin: 0; height: 36px; font-size: 21px; font-weight: 400; font-style: italic; line-height: 36px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.current .face h2 { padding-right: 40px; }
  .card.current .face h2 { font-size: 24px; }
  .lines { margin-top: 1px; line-height: var(--lh); font-size: 16px; flex: 1; overflow: hidden; }
  .lines p { margin: 0; }
  .lines .ref { font-family: var(--sans); font-size: 11px; color: var(--ink-faint); margin-right: 6px; }
  .lines .quote { color: var(--ink); }
  /* an earlier card has room for its last note only, cut at a whole line */
  .card:not(.current) .front .lines p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: var(--lh); margin-top: 4px;
    font-family: var(--sans); font-size: 12px; color: var(--ink-soft); }
  .foot a, .foot button { font-family: var(--sans); font-size: 12px; }
  .turn { border: 0; background: transparent; color: var(--ink-faint); padding: 2px 4px; border-radius: 4px; }
  .turn:hover { color: var(--accent); background: var(--accent-soft); }
  .resume { color: var(--accent); text-decoration: none; }
  .resume:hover { text-decoration: underline; }
  .ribbon { position: absolute; top: 0; right: 22px; width: 14px; height: 30px; background: var(--accent);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); }

  .back .desc { margin: 0; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.current .back .desc { -webkit-line-clamp: 4; }
  .back .facts { font-family: var(--sans); font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back .actions { display: flex; gap: 6px; align-items: center; }
  .back .actions .chip { padding: 2px 9px; font-size: 12px; background: var(--card); }

  .new { display: flex; align-items: center; justify-content: center; aspect-ratio: 5 / 3; border: 1px dashed var(--rule); border-radius: 3px;
    color: var(--ink-soft); font-style: italic; text-decoration: none; }
  .new:hover { border-color: var(--accent); color: var(--accent); }

  /* on a phone the card can grow past 5×3 rather than cut the writing off */
  @media (max-width: 520px) { .face { aspect-ratio: auto; min-height: 200px; } .card.current .face h2 { font-size: 20px; } .new { aspect-ratio: auto; min-height: 120px; } }
  @media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
</style>
</head>
<body>
<div data-top></div>
<main>
  <div class="head">
    <h1>Your foci</h1>
    <span class="meta">Turn a card over with ↻</span>
  </div>
  <div class="cards" id="cards"></div>
</main>
<div data-switch></div>
<script>
  const turned = new Set();

  Home.render = () => {
    const { esc, span, plural } = Home;
    const notes = (f) => [{ ref: f.latest.ref, text: f.latest.text }, ...f.recent];
    const card = (f) => `
      <article class="card ${f.current ? "current" : ""} ${turned.has(f.id) ? "turned" : ""}" data-card="${f.id}">
        <div class="inner">
          <div class="face front">
            ${f.current ? `<div class="ribbon" aria-hidden="true"></div>` : ""}
            <h2 title="${esc(f.title)}">${esc(f.title)}</h2>
            <div class="lines">${(f.current ? notes(f) : [f.latest]).map((n) => `<p><span class="ref">${esc(n.ref)}</span><span class="quote">${esc(n.text)}</span></p>`).join("")}</div>
            <div class="foot">
              ${f.current ? `<a class="resume" href="${Home.read}">Continue at ${esc(f.last.ref)} →</a>` : `<span>${span(f)} · ${plural(f.notes, "note")}</span>`}
              <button class="turn" type="button" data-turn="${f.id}" aria-label="Turn over">↻</button>
            </div>
          </div>
          <div class="face back" aria-hidden="${!turned.has(f.id)}">
            <h2>${esc(f.title)}</h2>
            <div class="lines">
              ${f.description ? `<p class="desc">${esc(f.description)}</p>` : ""}
              <p class="facts">${f.current ? "Current, " : ""}${span(f)} · ${plural(f.notes, "note")} · ${f.keeps} kept · ${f.works.join(", ")}</p>
            </div>
            <div class="foot">
              <span class="actions">${f.current
                ? `<a class="chip" href="#">All notes</a><a class="chip" href="#">Edit</a>`
                : `<button class="chip" type="button" data-restore="${f.id}">Make current</button><a class="chip" href="#">Read its notes</a>`}</span>
              <button class="turn" type="button" data-turn="${f.id}" aria-label="Turn back">↻</button>
            </div>
          </div>
        </div>
      </article>`;
    document.getElementById("cards").innerHTML = FOCI.map(card).join("") + `<a class="new" href="#">+ A new question</a>`;
  };

  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-turn]");
    if (!t) return;
    const id = Number(t.dataset.turn), el = document.querySelector(`[data-card="${id}"]`);
    turned.has(id) ? turned.delete(id) : turned.add(id);
    el.classList.toggle("turned");
    el.querySelector(".back").setAttribute("aria-hidden", String(!turned.has(id)));
  });
</script>
</body>
</html>
