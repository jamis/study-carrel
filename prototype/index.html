<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study — prototype</title>
<style>
  :root {
    --bg: #f6f1e7;
    --paper: #fbf8f1;
    --ink: #2b2620;
    --ink-soft: #6b6256;
    --rule: #e2d9c8;
    --accent: #8a4b2a;
    --accent-soft: #f0dcc9;
    --hl: #f7e3a4;
    --shadow: 0 8px 30px rgba(60, 40, 20, .12);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #17140f; --paper: #1e1a14; --ink: #e8dfcf; --ink-soft: #a09685;
    --rule: #342d22; --accent: #e0a070; --accent-soft: #3a2a1d; --hl: #5a4a1e;
    --shadow: 0 8px 30px rgba(0, 0, 0, .5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f; --paper: #1e1a14; --ink: #e8dfcf; --ink-soft: #a09685;
      --rule: #342d22; --accent: #e0a070; --accent-soft: #3a2a1d; --hl: #5a4a1e;
      --shadow: 0 8px 30px rgba(0, 0, 0, .5);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--serif); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- nav ---------- */
  .top { position: sticky; top: 0; z-index: 20; }
  .nav { background: var(--bg); border-bottom: 1px solid var(--rule); }
  .nav-in {
    max-width: 1180px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; gap: 12px;
    font-family: var(--sans); font-size: 14px;
  }
  .brand { font-family: var(--serif); font-style: italic; color: var(--ink-soft); }
  .where { flex: 1; text-align: center; font-weight: 600; letter-spacing: .01em; }
  .where small { color: var(--ink-soft); font-weight: 400; margin-left: 6px; }
  .chip {
    border: 1px solid var(--rule); background: transparent;
    padding: 6px 12px; border-radius: 999px; font-size: 13px; font-family: var(--sans);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn { border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; font-size: 16px; }
  .icon-btn:hover { background: var(--accent-soft); }

  /* ---------- focus: compact, always visible ---------- */
  .focus {
    position: relative;
    background: var(--paper);
    border-bottom: 2px solid var(--accent-soft);
  }
  .focus-head {
    max-width: 1180px; margin: 0 auto; padding: 9px 16px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    width: 100%; border: 0; background: none; text-align: center; cursor: pointer;
  }
  .focus-label {
    flex: none; font-family: var(--sans); font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--paper); background: var(--accent); border-radius: 4px; padding: 3px 7px 3px 9px;
  }
  .focus-title {
    margin: 0; font-weight: 400; font-style: italic; color: var(--accent);
    font-size: clamp(18px, 2.6vw, 24px); line-height: 1.25; text-wrap: balance;
  }
  .focus-caret { flex: none; color: var(--ink-soft); font-family: var(--sans); font-size: 12px; transition: transform .2s; }
  .focus.open .focus-caret { transform: rotate(180deg); }
  .focus-body {
    display: none; position: absolute; left: 0; right: 0; top: 100%;
    background: var(--paper); border-bottom: 1px solid var(--rule); box-shadow: var(--shadow);
    max-height: 60vh; overflow-y: auto;
  }
  .focus.open .focus-body { display: block; }
  .focus-body-in { max-width: 60ch; margin: 0 auto; padding: 14px 16px 18px; color: var(--ink-soft); font-size: 17px; }
  .focus-body p { margin: 0 0 10px; }
  .focus-actions { display: flex; gap: 8px; align-items: center; font-family: var(--sans); }
  .focus-edit input, .focus-edit textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
  }
  @media (max-width: 599px) {
    .focus-head { gap: 10px; padding: 8px 12px; }
  }

  /* ---------- layout ---------- */
  .layout {
    max-width: 1180px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px;
    padding: 28px 16px 120px;
  }
  @media (max-width: 899px) { .layout { grid-template-columns: 1fr; padding-bottom: 150px; } }

  /* ---------- lectio ---------- */
  .lectio {
    max-width: 34em; margin: 0 auto; width: 100%; text-align: left;
    display: flex; flex-direction: column; gap: 26px; padding: 8px 0 20px;
    touch-action: pan-y;
  }
  .near {
    font-size: 17px; color: var(--ink-soft); opacity: .5; cursor: pointer; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    text-wrap: pretty;
  }
  .near:hover { opacity: .9; }
  .near b { font-family: var(--sans); font-size: 11px; color: var(--accent); font-weight: 600; margin-right: 4px; }
  .now { font-size: clamp(22px, 3.6vw, 32px); line-height: 1.5; text-wrap: pretty; hyphens: auto; }
  .now.mid { font-size: clamp(20px, 3vw, 27px); line-height: 1.55; }
  .now.long { font-size: clamp(18px, 2.5vw, 22px); line-height: 1.7; }
  .now .ref {
    display: block; font-family: var(--sans); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
  }
  .steps { display: flex; justify-content: flex-start; gap: 12px; }

  .strip { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px; margin-top: 18px; }
  .tick {
    position: relative; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--rule); background: transparent;
    font-family: var(--sans); font-size: 12px; color: var(--ink-soft); padding: 0;
  }
  .tick:hover { border-color: var(--accent); color: var(--accent); }
  .tick.has::after {
    content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px;
    border-radius: 50%; background: var(--accent);
  }
  .tick.current { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .tick.current.has::after { background: var(--paper); }

  /* ---------- notes panel ---------- */
  .panel {
    align-self: start; position: sticky; top: 124px;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 14px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; max-height: calc(100vh - 144px);
  }
  .panel-handle { display: none; }
  .panel-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); font-family: var(--sans); }
  .panel-head .ref { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .panel-head .pfocus { font-family: var(--serif); font-style: italic; color: var(--accent); font-size: 15px; margin-top: 4px; }
  .notes { overflow-y: auto; padding: 6px 16px; flex: 1; min-height: 40px; }
  .empty { color: var(--ink-soft); font-style: italic; padding: 14px 0; font-size: 16px; }
  .note { padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 16.5px; line-height: 1.55; }
  .note:last-child { border-bottom: 0; }
  .note-meta { display: flex; justify-content: space-between; font-family: var(--sans); font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .note-meta button { border: 0; background: none; color: var(--ink-soft); padding: 0 2px; font-size: 12px; }
  .note-meta button:hover { color: var(--accent); }
  .note p { margin: 0 0 .5em; } .note p:last-child { margin: 0; }
  .note blockquote, .editor blockquote { margin: .4em 0; padding-left: 12px; border-left: 3px solid var(--accent-soft); color: var(--ink-soft); }
  .note ul, .note ol, .editor ul, .editor ol { margin: .3em 0; padding-left: 1.3em; }

  .composer { border-top: 1px solid var(--rule); padding: 10px 12px 12px; font-family: var(--sans); }
  .toolbar { display: none; gap: 4px; margin-bottom: 6px; }
  .composer.expanded .toolbar { display: flex; }
  .toolbar button { border: 1px solid var(--rule); background: transparent; border-radius: 6px; padding: 3px 9px; font-size: 13px; }
  .toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  .editor {
    font-family: var(--serif); font-size: 16.5px; line-height: 1.5;
    min-height: 44px; max-height: 120px; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--rule); border-radius: 10px;
    padding: 9px 11px; outline: none;
  }
  .composer.expanded .editor { min-height: 180px; max-height: 40vh; }
  .editor:focus { border-color: var(--accent); }
  .editor:empty::before { content: attr(data-placeholder); color: var(--ink-soft); opacity: .8; font-style: italic; pointer-events: none; }
  .composer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .primary { background: var(--accent); color: var(--paper); border: 0; border-radius: 999px; padding: 7px 16px; font-family: var(--sans); font-size: 14px; }
  .primary:hover { filter: brightness(1.08); }

  /* mobile bottom sheet */
  @media (max-width: 899px) {
    .panel {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 30;
      border-radius: 16px 16px 0 0; border-bottom: 0;
      max-height: 82vh; height: 82vh;
      transform: translateY(calc(100% - 66px - env(safe-area-inset-bottom)));
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .panel.open { transform: none; }
    .panel-handle {
      display: flex; align-items: center; gap: 10px; position: relative;
      height: 66px; padding: 0 16px; flex: none; cursor: pointer;
      font-family: var(--sans); font-size: 14px; border: 0; background: none; width: 100%; text-align: left;
    }
    .panel-handle::before { content: ""; position: absolute; top: 8px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: var(--rule); }
    .panel-handle .ref { font-weight: 600; }
    .panel-handle .count { color: var(--ink-soft); flex: 1; }
    .panel-handle .go { color: var(--accent); }
    .panel-head { padding-top: 4px; }
    .panel-head .ref { display: none; }
  }

  /* ---------- all-notes view ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; display: none; }
  .overlay.show { display: block; }
  .overlay-in { max-width: 44em; margin: 0 auto; padding: 22px 16px 80px; }
  .overlay-bar { display: flex; justify-content: space-between; align-items: center; font-family: var(--sans); font-size: 14px; margin-bottom: 18px; }
  .overlay h2 { font-size: clamp(26px, 4.5vw, 38px); font-style: italic; margin: 6px 0 4px; font-weight: 400; line-height: 1.2; color: var(--accent); }
  .overlay .sub { color: var(--ink-soft); font-family: var(--sans); font-size: 13px; margin-bottom: 28px; }
  .fv-item { margin: 0 0 28px; }
  .fv-ref { font-family: var(--sans); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); background: none; border: 0; padding: 0; }
  .fv-ref:hover { text-decoration: underline; }
  .fv-quote { font-style: italic; color: var(--ink-soft); margin: 4px 0 10px; font-size: 16px; }
  .fv-note { padding-left: 14px; border-left: 3px solid var(--accent-soft); margin-bottom: 8px; font-size: 17px; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-family: var(--sans); font-size: 13px; z-index: 99; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="top">
  <div class="nav">
    <div class="nav-in">
      <span class="brand">Study</span>
      <div class="where" id="where"></div>
      <button class="chip" id="btn-notes">All notes</button>
      <button class="icon-btn" id="btn-theme" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
    </div>
  </div>
  <section class="focus" id="focus">
    <button class="focus-head" id="focus-head" aria-expanded="false" title="About this focus">
      <span class="focus-label">Focus</span>
      <h1 class="focus-title" id="focus-title"></h1>
      <span class="focus-caret">▾</span>
    </button>
    <div class="focus-body"><div class="focus-body-in" id="focus-body"></div></div>
  </section>
</header>

<main class="layout">
  <article class="lectio" id="lectio">
    <div class="near" id="lec-prev"></div>
    <div class="now" id="lec-now"></div>
    <div class="near" id="lec-next"></div>
    <div class="steps">
      <button class="chip" id="lec-back">← Previous</button>
      <button class="chip" id="lec-fwd">Next →</button>
    </div>
    <nav class="strip" id="strip" aria-label="Verses"></nav>
  </article>

  <aside class="panel" id="panel">
    <button class="panel-handle" id="panel-handle">
      <span class="ref" id="h-ref"></span>
      <span class="count" id="h-count"></span>
      <span class="go" id="h-go">Notes ▴</span>
    </button>
    <div class="panel-head">
      <div class="ref" id="p-ref"></div>
      <div class="pfocus" id="p-focus"></div>
    </div>
    <div class="notes" id="notes"></div>
    <div class="composer" id="composer">
      <div class="toolbar" id="toolbar">
        <button data-cmd="bold"><b>B</b></button>
        <button data-cmd="italic"><i>I</i></button>
        <button data-cmd="formatBlock" data-arg="blockquote">❝</button>
        <button data-cmd="insertUnorderedList">• List</button>
        <button data-cmd="insertOrderedList">1. List</button>
      </div>
      <div class="editor" id="editor" contenteditable="true" data-placeholder="What do you notice? What does it stir?"></div>
      <div class="composer-row">
        <button class="chip" id="btn-expand" type="button">Expand</button>
        <button class="primary" id="btn-save" type="button">Add note</button>
      </div>
    </div>
  </aside>
</main>

<div class="overlay" id="overlay">
  <div class="overlay-in">
    <div class="overlay-bar">
      <button class="chip" id="ov-close">← Back to text</button>
      <button class="chip" id="ov-copy">Copy as Markdown</button>
    </div>
    <div class="focus-label" style="justify-content:flex-start"><span>Focus</span></div>
    <h2 id="ov-title"></h2>
    <div class="sub" id="ov-sub"></div>
    <div id="ov-list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const TEXTS = {
  isaiah: {
    where: "Isaiah 40", version: "KJV", ref: v => `Isaiah 40:${v}`,
    verses: [
"Comfort ye, comfort ye my people, saith your God.",
"Speak ye comfortably to Jerusalem, and cry unto her, that her warfare is accomplished, that her iniquity is pardoned: for she hath received of the LORD’S hand double for all her sins.",
"The voice of him that crieth in the wilderness, Prepare ye the way of the LORD, make straight in the desert a highway for our God.",
"Every valley shall be exalted, and every mountain and hill shall be made low: and the crooked shall be made straight, and the rough places plain:",
"And the glory of the LORD shall be revealed, and all flesh shall see it together: for the mouth of the LORD hath spoken it.",
"The voice said, Cry. And he said, What shall I cry? All flesh is grass, and all the goodliness thereof is as the flower of the field:",
"The grass withereth, the flower fadeth: because the spirit of the LORD bloweth upon it: surely the people is grass.",
"The grass withereth, the flower fadeth: but the word of our God shall stand for ever.",
"O Zion, that bringest good tidings, get thee up into the high mountain; O Jerusalem, that bringest good tidings, lift up thy voice with strength; lift it up, be not afraid; say unto the cities of Judah, Behold your God!",
"Behold, the Lord GOD will come with strong hand, and his arm shall rule for him: behold, his reward is with him, and his work before him.",
"He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom, and shall gently lead those that are with young.",
"Who hath measured the waters in the hollow of his hand, and meted out heaven with the span, and comprehended the dust of the earth in a measure, and weighed the mountains in scales, and the hills in a balance?",
"Who hath directed the Spirit of the LORD, or being his counsellor hath taught him?",
"With whom took he counsel, and who instructed him, and taught him in the path of judgment, and taught him knowledge, and shewed to him the way of understanding?",
"Behold, the nations are as a drop of a bucket, and are counted as the small dust of the balance: behold, he taketh up the isles as a very little thing.",
"And Lebanon is not sufficient to burn, nor the beasts thereof sufficient for a burnt offering.",
"All nations before him are as nothing; and they are counted to him less than nothing, and vanity.",
"To whom then will ye liken God? or what likeness will ye compare unto him?",
"The workman melteth a graven image, and the goldsmith spreadeth it over with gold, and casteth silver chains.",
"He that is so impoverished that he hath no oblation chooseth a tree that will not rot; he seeketh unto him a cunning workman to prepare a graven image, that shall not be moved.",
"Have ye not known? have ye not heard? hath it not been told you from the beginning? have ye not understood from the foundations of the earth?",
"It is he that sitteth upon the circle of the earth, and the inhabitants thereof are as grasshoppers; that stretcheth out the heavens as a curtain, and spreadeth them out as a tent to dwell in:",
"That bringeth the princes to nothing; he maketh the judges of the earth as vanity.",
"Yea, they shall not be planted; yea, they shall not be sown: yea, their stock shall not take root in the earth: and he shall also blow upon them, and they shall wither, and the whirlwind shall take them away as stubble.",
"To whom then will ye liken me, or shall I be equal? saith the Holy One.",
"Lift up your eyes on high, and behold who hath created these things, that bringeth out their host by number: he calleth them all by names by the greatness of his might, for that he is strong in power; not one faileth.",
"Why sayest thou, O Jacob, and speakest, O Israel, My way is hid from the LORD, and my judgment is passed over from my God?",
"Hast thou not known? hast thou not heard, that the everlasting God, the LORD, the Creator of the ends of the earth, fainteth not, neither is weary? there is no searching of his understanding.",
"He giveth power to the faint; and to them that have no might he increaseth strength.",
"Even the youths shall faint and be weary, and the young men shall utterly fall:",
"But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint."
],
  },
  // demo only: long prose paragraphs, to test how the reading view handles them
  prose: {
    where: "Walden · Where I Lived", version: "demo", ref: v => `Walden ¶${v}`,
    verses: [
"I went to the woods because I wished to live deliberately, to front only the essential facts of life, and see if I could not learn what it had to teach, and not, when I came to die, discover that I had not lived. I did not wish to live what was not life, living is so dear; nor did I wish to practise resignation, unless it was quite necessary. I wanted to live deep and suck out all the marrow of life, to live so sturdily and Spartan-like as to put to rout all that was not life, to cut a broad swath and shave close, to drive life into a corner, and reduce it to its lowest terms, and, if it proved to be mean, why then to get the whole and genuine meanness of it, and publish its meanness to the world; or if it were sublime, to know it by experience, and be able to give a true account of it in my next excursion.",
"Our life is frittered away by detail. An honest man has hardly need to count more than his ten fingers, or in extreme cases he may add his ten toes, and lump the rest. Simplicity, simplicity, simplicity! I say, let your affairs be as two or three, and not a hundred or a thousand; instead of a million count half a dozen, and keep your accounts on your thumb-nail."
    ],
    focus: { title: "What does it mean to live deliberately?", desc: "" }
  }
};
const T = TEXTS[new URLSearchParams(location.search).get("text")] || TEXTS.isaiah;
const VERSES = T.verses;
const refOf = T.ref;
const WHERE = T.where;

/* ---------- state ---------- */
const KEY = "study-prototype-v1" + (T === TEXTS.isaiah ? "" : "-prose");
const day = 86400000, now = Date.now();
const seed = {
  focus: {
    title: "What does it mean to be holy?",
    desc: "Holiness keeps showing up as something God is, and something we’re asked to be. I want to understand the difference between holy as “set apart” and holy as “good”."
  },
  current: 25, theme: null,
  notes: [
    { id: 1, verse: 25, ts: now - 3 * day, html: "<p>God asks, “To whom will ye liken me?” and answers with a name, <b>the Holy One</b>. Holiness here seems to mean <i>incomparable</i>: nothing else belongs in the same category.</p>" },
    { id: 2, verse: 25, ts: now - 1 * day, html: "<p>So is holy about <i>otherness</i> before it’s about <i>goodness</i>? Compare the idol-makers in 19–20, who try to make God manageable.</p>" },
    { id: 3, verse: 1, ts: now - 2 * day, html: "<p>Odd opening for a chapter about a holy God: <i>comfort</i>. Holiness and tenderness aren’t opposites.</p>" },
    { id: 4, verse: 11, ts: now - 2 * day, html: "<p>The same power that measures the waters in his hand (12) carries lambs in his bosom. Maybe holiness is power that stays gentle?</p>" }
  ]
};
if (T.focus) { seed.focus = T.focus; seed.notes = []; seed.current = 1; }
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || structuredClone(seed); } catch { S = structuredClone(seed); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const notesFor = v => S.notes.filter(n => n.verse === v).sort((a, b) => a.ts - b.ts);
const ago = ts => { const d = Math.floor((Date.now() - ts) / day); return d <= 0 ? "today" : d === 1 ? "yesterday" : d + " days ago"; };
const toast = msg => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); };

/* ---------- theme ---------- */
function applyTheme() {
  if (S.theme) document.documentElement.dataset.theme = S.theme;
  else delete document.documentElement.dataset.theme;
}
$("btn-theme").onclick = () => {
  const dark = S.theme ? S.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  S.theme = dark ? "light" : "dark"; applyTheme(); save();
};

/* ---------- focus ---------- */
function renderFocus(editing) {
  $("focus-title").textContent = S.focus.title;
  $("p-focus").textContent = S.focus.title;
  $("editor").dataset.placeholder = `How does this verse speak to your question?`;
  const n = S.notes.length, body = $("focus-body");
  if (editing) {
    body.innerHTML = `<div class="focus-edit">
      <input id="f-title" value="${esc(S.focus.title)}" aria-label="Focus">
      <textarea id="f-desc" rows="3" aria-label="Description">${esc(S.focus.desc)}</textarea>
      <div class="focus-actions"><button class="primary" id="f-save">Save</button><button class="chip" id="f-cancel">Cancel</button></div></div>`;
    $("f-save").onclick = () => { S.focus.title = $("f-title").value.trim() || S.focus.title; S.focus.desc = $("f-desc").value.trim(); save(); renderFocus(); };
    $("f-cancel").onclick = () => renderFocus();
  } else {
    body.innerHTML = `<p>${esc(S.focus.desc) || "<i>No description yet.</i>"}</p>
      <div class="focus-actions"><span style="font-size:13px">${n} note${n === 1 ? "" : "s"}</span>
      <button class="chip" id="f-edit">Edit focus</button></div>`;
    $("f-edit").onclick = () => renderFocus(true);
  }
}
$("focus-head").onclick = () => {
  const open = $("focus").classList.toggle("open");
  $("focus-head").setAttribute("aria-expanded", open);
};
document.addEventListener("click", e => {
  if (!e.target.closest("#focus")) { $("focus").classList.remove("open"); $("focus-head").setAttribute("aria-expanded", false); }
});

/* ---------- lectio ---------- */
function select(v) {
  S.current = Math.max(1, Math.min(VERSES.length, v)); save();
  renderLectio(); renderPanel();
}
function renderLectio() {
  const v = S.current;
  const near = x => x >= 1 && x <= VERSES.length ? `<b>${x}</b>${esc(VERSES[x - 1])}` : "";
  $("lec-prev").innerHTML = near(v - 1);
  $("lec-next").innerHTML = near(v + 1);
  const len = VERSES[v - 1].length;
  $("lec-now").className = "now" + (len > 450 ? " long" : len > 180 ? " mid" : "");
  $("lec-now").innerHTML = `<span class="ref">${refOf(v)}</span>${esc(VERSES[v - 1])}`;
  $("strip").innerHTML = VERSES.map((_, i) => {
    const n = i + 1;
    return `<button class="tick${n === v ? " current" : ""}${notesFor(n).length ? " has" : ""}" data-v="${n}" aria-label="Verse ${n}">${n}</button>`;
  }).join("");
}
$("lec-prev").onclick = $("lec-back").onclick = () => select(S.current - 1);
$("lec-next").onclick = $("lec-fwd").onclick = () => select(S.current + 1);
$("strip").onclick = e => { const b = e.target.closest(".tick"); if (b) select(+b.dataset.v); };
let tx = null;
$("lectio").addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
$("lectio").addEventListener("touchend", e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) select(S.current + (dx < 0 ? 1 : -1));
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowRight" || e.key === "j") select(S.current + 1);
  if (e.key === "ArrowLeft" || e.key === "k") select(S.current - 1);
  if (e.key === "Escape") closeOverlay();
});

/* ---------- notes panel ---------- */
function renderPanel() {
  const v = S.current, list = notesFor(v), ref = `${refOf(v)}`;
  $("p-ref").textContent = ref; $("h-ref").textContent = ref;
  $("h-count").textContent = list.length ? `${list.length} note${list.length === 1 ? "" : "s"}` : "No notes yet";
  $("notes").innerHTML = list.length ? list.map(n => `
    <div class="note" data-id="${n.id}">
      <div class="note-meta"><span>${ago(n.ts)}</span><span><button data-act="del">Delete</button></span></div>
      ${n.html}
    </div>`).join("") : `<div class="empty">Nothing here yet. What does this verse say to your question?</div>`;
  $("btn-notes").textContent = `All notes (${S.notes.length})`;
}
$("notes").onclick = e => {
  if (e.target.dataset.act !== "del") return;
  const id = +e.target.closest(".note").dataset.id;
  if (!confirm("Delete this note?")) return;
  S.notes = S.notes.filter(n => n.id !== id); save(); renderAll();
};
const panel = $("panel");
$("panel-handle").onclick = () => {
  const open = panel.classList.toggle("open");
  $("h-go").textContent = open ? "Close ▾" : "Notes ▴";
};

/* composer */
const ed = $("editor"), comp = $("composer");
$("btn-expand").onclick = () => {
  const x = comp.classList.toggle("expanded");
  $("btn-expand").textContent = x ? "Collapse" : "Expand"; ed.focus();
};
$("toolbar").onmousedown = e => e.preventDefault();
$("toolbar").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  document.execCommand(b.dataset.cmd, false, b.dataset.arg || null);
};
function addNote() {
  if (!ed.innerText.trim()) return;
  const html = ed.innerHTML.replace(/<div>/g, "<p>").replace(/<\/div>/g, "</p>").trim();
  S.notes.push({ id: Date.now(), verse: S.current, ts: Date.now(), html: html.includes("<") ? html : `<p>${html}</p>` });
  ed.innerHTML = ""; save(); renderAll();
  $("notes").scrollTop = 1e6;
}
$("btn-save").onclick = addNote;
ed.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addNote(); } });
ed.addEventListener("paste", e => { e.preventDefault(); document.execCommand("insertText", false, e.clipboardData.getData("text/plain")); });

/* ---------- all notes ---------- */
function renderOverlay() {
  $("ov-title").textContent = S.focus.title;
  const n = S.notes.length;
  $("ov-sub").textContent = `${n} note${n === 1 ? "" : "s"} across ${WHERE}`;
  const verses = [...new Set(S.notes.map(n => n.verse))].sort((a, b) => a - b);
  $("ov-list").innerHTML = verses.map(v => `
    <div class="fv-item">
      <button class="fv-ref" data-v="${v}">${refOf(v)}</button>
      <div class="fv-quote">${esc(VERSES[v - 1])}</div>
      ${notesFor(v).map(n => `<div class="fv-note">${n.html}</div>`).join("")}
    </div>`).join("") || `<div class="empty">No notes yet.</div>`;
}
const openOverlay = () => { renderOverlay(); $("overlay").classList.add("show"); };
const closeOverlay = () => $("overlay").classList.remove("show");
$("btn-notes").onclick = openOverlay;
$("ov-close").onclick = closeOverlay;
$("ov-list").onclick = e => {
  const b = e.target.closest(".fv-ref"); if (!b) return;
  closeOverlay(); select(+b.dataset.v);
};
$("ov-copy").onclick = async () => {
  const tmp = document.createElement("div");
  const md = [`# ${S.focus.title}`, "", S.focus.desc, ""];
  [...new Set(S.notes.map(n => n.verse))].sort((a, b) => a - b).forEach(v => {
    md.push(`## ${refOf(v)}`, "", `> ${VERSES[v - 1]}`, "");
    notesFor(v).forEach(n => { tmp.innerHTML = n.html; md.push(tmp.innerText.trim(), ""); });
  });
  try { await navigator.clipboard.writeText(md.join("\n")); toast("Copied Markdown"); }
  catch { toast("Couldn’t access clipboard"); }
};

/* ---------- boot ---------- */
function renderAll() { renderFocus(); renderLectio(); renderPanel(); }
$("where").innerHTML = `${esc(T.where)}<small>${esc(T.version)}</small>`;
applyTheme(); renderAll();
</script>
</body>
</html>
