<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clause by Clause</title>
<link rel="stylesheet" href="common.css">
<style>
  /* The prose-by-sentence reader, with a sentence split further at its punctuation, on the client, for reading.
     The note, the keep and the reference stay with the whole sentence; only the eye moves. */
  body { display: grid; grid-template-columns: 52px minmax(0, 1fr) 380px; min-height: 100vh; }
  .rail {
    position: sticky; top: 0; z-index: 30; height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 0;
  }
  .rail .icon-btn { width: 36px; height: 36px; padding: 0; }
  .rail .pop { left: 48px; }
  #menu { top: 10px; min-width: 220px; }
  .rail-wrap { position: relative; }

  .main { padding: 22px 56px 80px 44px; display: flex; flex-direction: column; min-width: 0; }
  .passage { margin: 14vh 0 0; max-width: 34em; }

  /* The focus stands over the passage: soft italic, a thought bubble, a rule across the column. */
  .over { display: flex; gap: 10px; align-items: baseline; padding-bottom: 14px; margin-bottom: 22px; border-bottom: 1px solid var(--rule);
          font-style: italic; color: var(--ink-soft); font-size: clamp(16px, 2.2vw, 19px); line-height: 1.35; }
  .over svg { flex: none; width: 16px; height: 16px; fill: none; stroke: var(--ink-faint); stroke-width: 1.5; transform: translateY(2px); }

  .ref-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ref-row .work { font-family: var(--sans); font-size: 12px; color: var(--ink-faint); margin-left: 6px; }

  .verse { position: relative; }
  .pilcrow { position: absolute; left: -1em; font-weight: 400; color: var(--accent); opacity: .7; }

  .steps { display: flex; align-items: center; gap: 4px; margin-top: 44px; font-family: var(--sans); font-size: 13px; position: relative; flex-wrap: wrap; }
  .steps > button { border: 0; background: none; padding: 6px 10px; border-radius: 8px; color: var(--ink-faint); }
  .steps > button:first-child { margin-left: -10px; }
  .steps > button:hover:not(:disabled), .steps > button[aria-expanded="true"] { color: var(--accent); background: var(--accent-soft); }
  .steps > button:disabled { visibility: hidden; }
  .steps .of { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .steps .whole { margin-left: 10px; font-family: var(--serif); font-size: 16px; line-height: 1; }
  .steps .zoom { font-family: var(--serif); font-size: 19px; line-height: 1; font-weight: 700; min-width: 32px; }
  .steps .zoom[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
  .steps .zoom:disabled { visibility: visible !important; opacity: .35; }

  /* Where you are in the sentence: a pip per clause, the current one long. Opens “Break at”. */
  .steps .pips { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 8px; }
  .steps .pips i { width: 5px; height: 5px; border-radius: 3px; background: var(--ink-faint); opacity: .55; transition: width .2s, background .2s, opacity .2s; }
  .steps .pips i.here { width: 14px; background: var(--accent); opacity: 1; }
  .steps .pips[hidden] { display: none; }

  #picker { left: 0; top: calc(100% + 6px); }
  #whole { left: -16px; top: calc(100% + 6px); width: min(36em, calc(100vw - 32px)); }
  #breaks { right: 0; top: calc(100% + 6px); width: 250px; }

  .breaks { padding: 4px 6px 6px; }
  .breaks .row { display: flex; gap: 6px; margin: 4px 6px 10px; }
  .breaks .row button {
    flex: 1; height: 38px; border: 1px solid var(--rule); border-radius: 8px; background: none;
    font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--ink-faint);
  }
  .breaks .row button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .breaks p { margin: 0 6px 4px; font-size: 12.5px; line-height: 1.45; color: var(--ink-soft); }

  /* Sentence picker and whole paragraph, as in sentences.html. */
  .plist { position: relative; max-height: min(60vh, 520px); overflow-y: auto; padding: 4px; width: 300px; }
  .prow { display: flex; align-items: flex-start; gap: 4px; padding: 2px 0; }
  .prow .pn { flex: none; width: 40px; padding-top: 7px; font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .prow .pn.here { color: var(--accent); }
  .prow .ss { display: flex; flex-wrap: wrap; gap: 2px; }
  .plist button { position: relative; width: 30px; height: 30px; border: 0; border-radius: 6px; background: none; font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .plist button:hover { background: var(--accent-soft); color: var(--ink); }
  .plist button.here { color: var(--accent); font-weight: 700; }
  .plist button.noted::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--accent); }
  .whole-text { position: relative; max-height: 50vh; overflow-y: auto; padding: 10px 12px; font-family: var(--serif); font-size: 17px; line-height: 1.6; color: var(--ink-soft); }
  .whole-text span { cursor: pointer; border-radius: 3px; }
  .whole-text span:hover { color: var(--ink); }
  .whole-text span.here { color: var(--ink); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }

  /* ---------- the clauses ---------- */
  .seg { transition: color .25s ease, background-color .25s ease, opacity .25s ease; border-radius: .12em; }
  .zoomed .seg { cursor: pointer; }

  /* A · Spotlight: the clause in full ink, the rest of the sentence dimmed in place. */
  .style-a .zoomed .seg:not(.here) { color: color-mix(in srgb, var(--ink) 26%, var(--bg)); }
  .style-a .zoomed .seg:not(.here):hover { color: color-mix(in srgb, var(--ink) 50%, var(--bg)); }

  /* B · Lines: the sentence set out a clause to a line, like verse; wrapped lines hang. The rest dimmed, less. */
  .style-b .zoomed .seg { display: block; padding-left: 1.4em; text-indent: -1.4em; }
  .style-b .zoomed .seg + .seg { margin-top: .15em; }
  .style-b .zoomed .seg:not(.here) { color: color-mix(in srgb, var(--ink) 38%, var(--bg)); }
  .style-b .zoomed .seg:not(.here):hover { color: color-mix(in srgb, var(--ink) 60%, var(--bg)); }
  .style-b .zoomed .seg.here::before { content: ""; position: absolute; left: -.9em; width: 2px; height: 1.1em; margin-top: .25em; background: var(--accent); border-radius: 1px; }
  .style-b .zoomed .seg.here { position: relative; }

  /* C · Magnify: the clause at full size, what comes before and after it shrunk to small faint type around it. */
  .style-c .zoomed .ctx { display: block; font-size: 17px; line-height: 1.6; font-weight: 400; color: var(--ink-faint); }
  .style-c .zoomed .ctx.before { margin-bottom: .55em; }
  .style-c .zoomed .ctx.after { margin-top: .55em; }
  .style-c .zoomed .ctx .seg:hover { color: var(--ink-soft); }
  .style-c .zoomed .seg.here { display: block; }
  .style-c .zoomed .seg.here.turn { animation: turn .22s ease-out; }

  /* D · Marker: a soft highlighter moves along the sentence, the rest dimmed as in Spotlight. */
  .style-d .zoomed .seg.here { background: var(--accent-soft); box-shadow: 0 0 0 .1em var(--accent-soft); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .style-d .zoomed .seg:not(.here) { color: color-mix(in srgb, var(--ink) 26%, var(--bg)); }
  .style-d .zoomed .seg:not(.here):hover { color: color-mix(in srgb, var(--ink) 50%, var(--bg)); background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }

  @media (prefers-reduced-motion: reduce) { .seg { transition: none; } .style-c .zoomed .seg.here.turn { animation: none; } }

  /* Docked note: unchanged, still the whole sentence's. */
  .dock { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--paper); border-left: 1px solid var(--rule); padding: 26px 28px 18px; }
  .dock-head { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--sans); margin-bottom: 16px; }
  .dock-head .lbl { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); }
  .dock .note-editor { flex: 1; overflow-y: auto; }
  .dock .note-tools { padding-top: 10px; border-top: 1px solid var(--rule); opacity: 0; transition: opacity .2s; }
  .dock:focus-within .note-tools { opacity: 1; }
  .handle, .phone-top { display: none; }

  /* Prototype-only: style and text switches. */
  .proto-opts { position: fixed; left: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; font-family: var(--sans); font-size: 11px; opacity: .4; z-index: 30; transition: opacity .15s; }
  .proto-opts:hover { opacity: 1; }
  .proto-opts div { display: flex; flex-direction: column; }
  .proto-opts a { padding: 5px 7px; color: var(--ink-soft); text-decoration: none; background: var(--paper); border: 1px solid var(--rule); border-left: 0; }
  .proto-opts a + a { border-top: 0; }
  .proto-opts a.on { color: var(--paper); background: var(--accent); border-color: var(--accent); }

  @media (max-width: 899px) {
    body { display: block; }
    .rail { display: none; }
    .phone-top { display: flex; justify-content: flex-end; position: absolute; top: 10px; right: 8px; z-index: 20; }
    .phone-top .pop { right: 0; top: calc(100% + 4px); min-width: 230px; }
    .main { padding: 14px 16px 140px 16px; }
    .passage { margin-top: 8vh; }
    .pilcrow { position: static; padding-right: .2em; }
    .style-b .zoomed .seg.here::before { left: -.55em; }
    #whole { left: 0; width: calc(100vw - 32px); }
    #breaks { right: auto; left: 0; }
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: 75vh; z-index: 35; border: 0; border-top: 1px solid var(--rule);
      border-radius: 14px 14px 0 0; box-shadow: var(--shadow); padding: 0 16px calc(14px + env(safe-area-inset-bottom));
      transform: translateY(calc(100% - 52px - env(safe-area-inset-bottom))); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .dock.open { transform: none; }
    .dock-head { display: none; }
    .dock .note-tools { opacity: 1; }
    .handle { display: flex; align-items: center; gap: 10px; height: 52px; flex: none; width: 100%; padding: 0; border: 0; background: none; text-align: left; font-family: var(--sans); }
    .handle .lbl { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); }
    .handle [data-note-preview] { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--serif); font-size: 15px; color: var(--ink-soft); }
    .handle [data-note-preview].empty { font-style: italic; color: var(--ink-faint); }
    .ref-row .work { display: none; }
    .proto-opts { top: auto; bottom: 64px; transform: none; flex-direction: row; font-size: 10px; }
    .proto-opts div { flex-direction: row; }
    .proto-opts a + a { border-top: 1px solid var(--rule); border-left: 0; }
  }
</style>
<script src="prose.js"></script>
</head>
<body>
  <nav class="rail" aria-label="Tools">
    <div class="rail-wrap">
      <button class="icon-btn" type="button" data-pop-toggle="menu" aria-expanded="false" aria-label="Menu" style="font-size:19px">⋯</button>
      <div class="pop" id="menu" data-menu></div>
    </div>
    <button class="icon-btn" type="button" aria-label="Your focuses"><svg viewBox="0 0 24 24"><path d="M5 6.5C5 5 6.5 4 12 4s7 1 7 2.5v6c0 1.5-1.5 2.5-7 2.5l-4 4v-4.2C6 14.4 5 13.6 5 12.5z"/></svg></button>
    <button class="icon-btn" type="button" aria-label="Go up"><svg viewBox="0 0 24 24"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg></button>
    <button class="icon-btn" type="button" aria-label="Recent places"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
    <button class="icon-btn" type="button" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
    <button class="icon-btn" type="button" aria-label="Kept"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg></button>
  </nav>

  <main class="main" data-style-root>
    <div class="phone-top">
      <button class="icon-btn" type="button" data-pop-toggle="pmenu" aria-expanded="false" aria-label="Menu" style="font-size:19px">⋯</button>
      <div class="pop" id="pmenu" data-menu></div>
    </div>
    <article class="passage" data-swipe>
      <div class="over"><svg viewBox="0 0 16 16"><path d="M3 6.5C3 4.5 5 3 8 3s5 1.5 5 3.5S11 10 8 10c-.6 0-1.2 0-1.7-.2L4 11.5l.5-2.2C3.6 8.6 3 7.6 3 6.5z"/><circle cx="3" cy="13.5" r="1"/></svg><span>What would it mean to live deliberately?</span></div>
      <div class="ref-row">
        <button class="keep-btn" type="button" data-keep aria-label="Keep"><svg viewBox="0 0 12 16"><path d="M1 1h10v14l-5-4-5 4z"/></svg></button>
        <span class="ref-label" data-ref></span>
        <span class="work" data-work></span>
      </div>
      <p class="verse" data-body aria-live="polite"></p>
      <nav class="steps" aria-label="Sentences">
        <button type="button" data-prev>‹</button>
        <button type="button" class="of" data-pop-toggle="picker" aria-expanded="false" title="Go to a sentence"><span data-n></span> of <span data-count></span></button>
        <button type="button" data-next>›</button>
        <button type="button" class="whole" data-pop-toggle="whole" aria-expanded="false" title="The whole paragraph (p)" aria-label="The whole paragraph">¶</button>
        <button type="button" class="zoom" data-zoom aria-pressed="false">;</button>
        <button type="button" class="pips" data-pop-toggle="breaks" aria-expanded="false" title="Where to break (clause n of N)" data-pips hidden></button>
        <div class="pop" id="picker"><div class="plist" data-plist></div></div>
        <div class="pop" id="whole"><div class="whole-text" data-whole></div></div>
        <div class="pop" id="breaks"><div class="breaks">
          <div class="menu-head">Break at</div>
          <div class="row" data-marks></div>
          <p>A lone word joins the next clause. Your note, keep and place stay with the whole sentence.</p>
        </div></div>
      </nav>
    </article>
  </main>

  <aside class="dock">
    <button class="handle" type="button" onclick="this.parentElement.classList.toggle('open')">
      <span class="lbl">Note</span><span data-note-preview></span><span style="color:var(--ink-faint)">▴</span>
    </button>
    <div class="dock-head"><span class="lbl">Note · <span data-ref></span></span><span class="note-status" data-note-status></span></div>
    <div class="note-editor" contenteditable="true" data-note data-placeholder="What comes to mind?"></div>
    <div class="note-tools">
      <button type="button" data-tool="bold"><b>B</b></button><button type="button" data-tool="italic"><i>I</i></button>
      <button type="button" data-tool="formatBlock" data-arg="blockquote">❝</button><button type="button" data-tool="insertUnorderedList">•</button>
    </div>
  </aside>

  <nav class="proto-opts" aria-label="Prototype options" data-opts></nav>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const textKey = params.get("text") === "emerson" ? "emerson" : "walden";
  const style = ["a", "b", "c", "d"].includes(params.get("style")) ? params.get("style") : "d";
  const STYLES = { a: "Spotlight", b: "Lines", c: "Magnify", d: "Marker" };
  const T = window.PROSE[textKey];

  const units = T.paragraphs.flatMap((ss, pi) => ss.map((text, si) => ({ p: pi + 1, s: si + 1, text })));
  const refOf = (u) => `${T.chapter} ${u.p}:${u.s}`;
  const keyOf = (u) => `${u.p}:${u.s}`;

  const SAMPLES = {
    walden: [["I went to the woods", "<p>“Deliberately”: weighed, as on scales (<em>libra</em>). Not slowly; on purpose.</p>"],
             ["Simplify, simplify", "<p>He says it twice. The repetition undercuts the advice, and I think he knows.</p>"],
             ["Our life is frittered away", "<p>Frittered: broken into fragments. The opposite of deliberate is not fast but scattered.</p>"]],
    emerson: [["Trust thyself", "<p>The iron string: something already tuned, not something built.</p>"],
              ["A foolish consistency", "<p>Deliberate is not the same as consistent. A chosen life can change its mind.</p>"],
              ["Nothing can bring you peace but yourself", "<p>Is this true, or just bracing?</p>"]],
  };
  const notes = {}, kept = new Set();
  SAMPLES[textKey].forEach(([words, html], i) => {
    const u = units.find((u) => u.text.includes(words));
    if (u) { notes[keyOf(u)] = html; if (i === 0) kept.add(keyOf(u)); }
  });

  // ---------- segmenting, on the client ----------
  // Each mark is where a break may fall. Commas, semicolons and colons need a space after them (so 1,000 and 3:16 hold),
  // past any closing quote or bracket; a dash breaks after itself, space or not; parentheses break before ( and after ).
  const MARKS = [
    { key: ",", label: ",", re: /,[’”'")\]]*\s+/g },
    { key: ";", label: ";", re: /;[’”'")\]]*\s+/g },
    { key: ":", label: ":", re: /:[’”'")\]]*\s+/g },
    { key: "—", label: "—", re: /—[’”'"]*\s*/g },
    { key: "()", label: "( )", re: /\s+(?=\()|\)[’”'"]*\s+/g },
  ];
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  let breaks = new Set(store.get("clauses.breaks", [",", ";", ":", "—"]));
  const MIN_WORDS = 2;

  function segment(text) {
    const cuts = new Set();
    MARKS.forEach((m) => { if (!breaks.has(m.key)) return; for (const x of text.matchAll(m.re)) { const at = x.index + x[0].length; if (at > 0 && at < text.length) cuts.add(at); } });
    const at = [0, ...[...cuts].sort((a, b) => a - b), text.length];
    let segs = [];
    for (let i = 0; i < at.length - 1; i++) {
      const raw = text.slice(at[i], at[i + 1]), body = raw.trimEnd();
      if (body) segs.push({ text: body, gap: raw.slice(body.length) });
    }
    // A lone word (“Well,” “Simplify,”) joins the next; a lone last word joins the one before.
    const words = (s) => s.text.split(/\s+/).filter(Boolean).length;
    for (let i = 0; i < segs.length - 1; ) {
      if (words(segs[i]) < MIN_WORDS) { segs[i + 1] = { text: segs[i].text + segs[i].gap + segs[i + 1].text, gap: segs[i + 1].gap }; segs.splice(i, 1); }
      else i++;
    }
    if (segs.length > 1 && words(segs.at(-1)) < MIN_WORDS) {
      const a = segs.at(-2), b = segs.pop();
      segs[segs.length - 1] = { text: a.text + a.gap + b.text, gap: b.gap };
    }
    return segs;
  }

  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const plain = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.trim(); };
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const sizeOf = (t) => (t.length > 450 ? "long" : t.length > 180 ? "mid" : "");

  // Off until turned on; then on for every sentence until turned off or the reader is left (here: kept in memory, not stored).
  let n = 1, si = 0, zoomed = false, segs = [];

  // Stepping: inside a sentence while zoomed, then on into the next sentence's first clause (or the last sentence's last).
  function step(d) {
    if (zoomed && segs.length > 1 && si + d >= 0 && si + d < segs.length) { si += d; return render("seg"); }
    go(n + d, d < 0 ? "end" : "start");
  }
  function go(to, edge = "start") {
    to = Math.max(1, Math.min(units.length, to));
    if (to === n) return;
    n = to;
    si = edge === "end" ? Infinity : 0;
    history.replaceState(null, "", `${location.search}#u${n}`);
    render("unit");
  }
  function setZoom(on, at = 0) {
    zoomed = on; si = at;
    render("seg");
  }

  function bodyHtml(u) {
    const pil = u.s === 1 ? '<span class="pilcrow" aria-label="New paragraph">¶</span>' : "";
    const span = (s, i) => `<span class="seg${zoomed && i === si ? " here" : ""}" data-seg="${i}">${esc(s.text)}</span>`;
    if (!zoomed || segs.length < 2) return pil + segs.map((s, i) => span(s, i) + s.gap).join("");
    if (style === "c") {
      const before = segs.slice(0, si), after = segs.slice(si + 1);
      return pil +
        (before.length ? `<span class="ctx before">${before.map((s, i) => span(s, i) + s.gap).join("")}</span>` : "") +
        `<span class="seg here turn" data-seg="${si}">${esc(segs[si].text)}</span>` +
        (after.length ? `<span class="ctx after">${after.map((s, i) => span(s, si + 1 + i) + s.gap).join("")}</span>` : "");
    }
    return pil + segs.map((s, i) => span(s, i) + s.gap).join("");
  }

  function render(why) {
    const u = units[n - 1], key = keyOf(u), note = notes[key] || "";
    segs = segment(u.text);
    si = Math.max(0, Math.min(segs.length - 1, si));
    const live = zoomed && segs.length > 1;

    $$("[data-ref]").forEach((el) => (el.textContent = refOf(u)));
    $$("[data-work]").forEach((el) => (el.textContent = `${T.author} · ${T.work}`));
    $$("[data-n]").forEach((el) => (el.textContent = n));
    $$("[data-count]").forEach((el) => (el.textContent = units.length));
    $$("[data-body]").forEach((el) => {
      el.innerHTML = bodyHtml(u);
      el.classList.toggle("zoomed", live);
      el.classList.remove("mid", "long", "turn");
      // Magnify sizes the passage by its clause, so a long sentence's clauses come up to full size.
      const sized = live && style === "c" ? segs[si].text : u.text;
      if (sizeOf(sized)) el.classList.add(sizeOf(sized));
      if (why === "unit") { void el.offsetWidth; el.classList.add("turn"); }
    });
    if (why !== "seg") {
      $$("[data-note]").forEach((el) => { if (el !== document.activeElement || why === "unit") el.innerHTML = note; });
      $$("[data-note-preview]").forEach((el) => { el.textContent = note ? plain(note) : "Write a note"; el.classList.toggle("empty", !note); });
      $$("[data-note-status]").forEach((el) => (el.textContent = ""));
    }

    const inside = (d) => live && si + d >= 0 && si + d < segs.length;
    $$("[data-prev]").forEach((el) => { el.disabled = n === 1 && !inside(-1); el.title = inside(-1) ? "Previous clause (k, or K for the sentence)" : n > 1 ? `Previous sentence: ${refOf(units[n - 2])}` : ""; });
    $$("[data-next]").forEach((el) => { el.disabled = n === units.length && !inside(1); el.title = inside(1) ? "Next clause (j, or J for the sentence)" : n < units.length ? `Next sentence: ${refOf(units[n])}` : ""; });
    $$("[data-zoom]").forEach((el) => {
      el.setAttribute("aria-pressed", zoomed);
      el.title = zoomed ? "Read the whole sentence (;)" : segs.length > 1 ? `Read clause by clause: ${segs.length} here (;)` : "Read clause by clause (;)";
    });
    $$("[data-pips]").forEach((el) => {
      el.hidden = !zoomed;
      el.innerHTML = segs.map((_, i) => `<i class="${live && i === si ? "here" : ""}"></i>`).join("");
      el.setAttribute("aria-label", `Clause ${si + 1} of ${segs.length}. Where to break`);
    });
    $$("[data-marks]").forEach((el) => {
      el.innerHTML = MARKS.map((m) => `<button type="button" data-mark="${m.key}" aria-pressed="${breaks.has(m.key)}" title="Break at ${m.label}">${m.label}</button>`).join("");
    });
    $$("[data-keep]").forEach((el) => { el.classList.toggle("kept", kept.has(key)); el.title = kept.has(key) ? "Kept (b)" : "Keep this passage (b)"; });
    $$("[data-v]").forEach((b) => {
      const v = units[+b.dataset.v - 1];
      b.classList.toggle("here", +b.dataset.v === n);
      b.classList.toggle("noted", !!notes[keyOf(v)]);
    });
    $$("[data-pn]").forEach((el) => el.classList.toggle("here", +el.dataset.pn === u.p));
    $$("[data-whole]").forEach((el) => {
      el.innerHTML = units.map((v, i) => v.p === u.p ? `<span data-v="${i + 1}" class="${i + 1 === n ? "here" : ""}">${esc(v.text)}</span>` : "").filter(Boolean).join(" ");
    });
  }

  function build() {
    $$("[data-menu]").forEach((el) => (el.innerHTML = `
      <a class="menu-item" href="#">Notes on this focus</a>
      <a class="menu-item" href="#">Random · Prose</a>
      <a class="menu-item" href="#">Your texts</a>
      <div class="menu-sep"></div>
      <button class="menu-item" type="button" data-theme-toggle>Light / dark</button>
      <a class="menu-item" href="#">Sign out</a>`));
    $$("[data-plist]").forEach((el) => {
      el.innerHTML = T.paragraphs.map((ss, pi) => {
        const first = units.findIndex((u) => u.p === pi + 1) + 1;
        return `<div class="prow"><span class="pn" data-pn="${pi + 1}">¶ ${pi + 1}</span><span class="ss">` +
          ss.map((t, i) => `<button type="button" data-v="${first + i}" title="${esc(t.slice(0, 90))}${t.length > 90 ? "…" : ""}">${i + 1}</button>`).join("") + "</span></div>";
      }).join("");
    });
    document.body.classList.add(`style-${style}`);
    const opts = () => {
      const link = (q, label, on) => `<a href="?${q}#u${q.includes(textKey) ? n : 1}" class="${on ? "on" : ""}">${label}</a>`;
      return `<div>${Object.entries(STYLES).map(([k, l]) => link(`text=${textKey}&style=${k}`, `${k.toUpperCase()} ${l}`, k === style)).join("")}</div>` +
        `<div>${link(`text=walden&style=${style}`, "Thoreau", textKey === "walden")}${link(`text=emerson&style=${style}`, "Emerson", textKey === "emerson")}</div>`;
    };
    const el = document.querySelector("[data-opts]");
    el.innerHTML = opts();
    el.addEventListener("mouseenter", () => (el.innerHTML = opts()));
    el.addEventListener("touchstart", () => (el.innerHTML = opts()), { passive: true });
  }

  const closePops = (except) => {
    $$(".pop.open").forEach((p) => { if (p !== except) p.classList.remove("open"); });
    $$("[data-pop-toggle]").forEach((b) => { if (!except || b.dataset.popToggle !== except.id) b.setAttribute("aria-expanded", "false"); });
  };
  const togglePop = (id) => {
    const pop = document.getElementById(id), open = !pop.classList.contains("open");
    closePops(pop);
    pop.classList.toggle("open", open);
    document.querySelector(`[data-pop-toggle="${id}"]`)?.setAttribute("aria-expanded", open);
    const box = pop.querySelector(".plist, .whole-text"), here = box?.querySelector(".here");
    if (open && box) box.style.maxHeight = `${Math.max(200, innerHeight - box.getBoundingClientRect().top - 24)}px`;
    if (open && here) box.scrollTop = here.offsetTop - box.clientHeight / 2 + here.offsetHeight / 2;
  };
  const toggleKeep = () => { const k = keyOf(units[n - 1]); kept.has(k) ? kept.delete(k) : kept.add(k); render(); };

  let saveTimer;
  function wire() {
    document.addEventListener("click", (e) => {
      const t = e.target;
      // Once clause reading is on, clicking a clause moves there; not when the click was the end of a text selection.
      const seg = zoomed && segs.length > 1 && t.closest("[data-body] [data-seg]");
      if (seg && !String(getSelection())) {
        if (+seg.dataset.seg !== si) { si = +seg.dataset.seg; render("seg"); }
        return;
      }
      const v = t.closest("[data-v]");
      if (v) { go(+v.dataset.v); if (!v.closest("[data-whole]")) closePops(); return; }
      if (t.closest("[data-prev]")) return step(-1);
      if (t.closest("[data-next]")) return step(1);
      if (t.closest("[data-zoom]")) return setZoom(!zoomed);
      const mark = t.closest("[data-mark]");
      if (mark) {
        const k = mark.dataset.mark;
        breaks.has(k) ? breaks.delete(k) : breaks.add(k);
        store.set("clauses.breaks", [...breaks]);
        si = 0;
        return render("seg");
      }
      if (t.closest("[data-keep]")) return toggleKeep();
      if (t.closest("[data-theme-toggle]")) {
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
        document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
        return closePops();
      }
      const tool = t.closest("[data-tool]");
      if (tool) { e.preventDefault(); document.execCommand(tool.dataset.tool, false, tool.dataset.arg); return; }
      const toggle = t.closest("[data-pop-toggle]");
      if (toggle) return togglePop(toggle.dataset.popToggle);
      if (!t.closest(".pop")) closePops();
    });

    document.addEventListener("input", (e) => {
      const ed = e.target.closest("[data-note]");
      if (!ed) return;
      const key = keyOf(units[n - 1]), html = ed.innerHTML.trim(), empty = !ed.textContent.trim();
      if (empty) delete notes[key]; else notes[key] = html;
      $$("[data-note-status]").forEach((el) => (el.textContent = "Saving…"));
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => $$("[data-note-status]").forEach((el) => (el.textContent = empty ? "Note removed" : "Saved")), 600);
      $$("[data-note-preview]").forEach((el) => { el.textContent = empty ? "Write a note" : plain(html); el.classList.toggle("empty", empty); });
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closePops(); document.activeElement?.blur(); return; }
      if (e.target.closest("[contenteditable], input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "j" || e.key === "ArrowRight") { e.preventDefault(); step(1); }
      else if (e.key === "k" || e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
      else if (e.key === "J") { e.preventDefault(); go(n + 1); }
      else if (e.key === "K") { e.preventDefault(); go(n - 1); }
      else if (e.key === ";") setZoom(!zoomed);
      else if (e.key === "b") toggleKeep();
      else if (e.key === "p") togglePop("whole");
      else if (e.key === "n") { const ed = $$("[data-note]").find((el) => el.offsetParent); if (ed) { e.preventDefault(); ed.focus(); } }
    });

    $$("[data-swipe]").forEach((el) => {
      let x0, y0;
      el.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
      el.addEventListener("touchend", (e) => {
        const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
      });
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    const m = location.hash.match(/^#u(\d+)$/);
    const start = units.findIndex((u) => u.text.includes(textKey === "walden" ? "I went to the woods" : "Trust thyself")) + 1;
    n = m ? Math.max(1, Math.min(units.length, +m[1])) : Math.max(1, start);
    build();
    wire();
    render("unit");
  });
})();
</script>
</body>
</html>
